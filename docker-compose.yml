services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streetwalker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-streetwalker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streetwalker}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
