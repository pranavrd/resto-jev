[project]
name = "streetwalker"
version = "0.0.1"
description = "Jev-driven street survey of Philadelphia, with TableMap restaurant intelligence on top"
requires-python = ">=3.12"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetwalker"]

[tool.ruff]
line-length = 100
